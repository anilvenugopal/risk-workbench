# site.conf.template — Risk Analysis Workbench app config, for placement in
# nginx's /etc/nginx/conf.d/ folder (a fragment included by the system's own
# main nginx.conf, not a standalone config).
#
# For a standalone/full nginx.conf (Docker, manual testing with
# `nginx -c ...`), use deploy/nginx/nginx.conf instead — that file contains
# this same server block plus the surrounding worker_processes/events/http
# wrapper a conf.d fragment must NOT include (nginx rejects directives like
# "worker_processes" outside the main config).
#
# ${APP_ROOT} must be substituted with the real checkout path before nginx
# reads this file — it is not valid nginx syntax on its own. Run:
#   APP_ROOT=/path/to/risk-workbench envsubst '$APP_ROOT' \
#       < deploy/nginx/site.conf > /etc/nginx/conf.d/risk-workbench.conf
#   sudo systemctl reload nginx
#
# Ports:
#   80  → HTTP (dev only; add TLS termination block for production)
#   8000 → uvicorn (internal only)

upstream uvicorn {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Static assets — served directly by nginx; never reaches uvicorn.
    location /static/ {
        alias ${APP_ROOT}/app/static/;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # SSE endpoint — disable buffering explicitly.
    location /api/events {
        proxy_pass http://uvicorn;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # All other requests → uvicorn.
    location / {
        proxy_pass http://uvicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
