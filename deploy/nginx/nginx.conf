# nginx.conf.template — reverse proxy for the Risk Analysis Workbench.
#
# ${APP_ROOT} must be substituted with the real checkout path before nginx
# reads this file — it is not valid nginx syntax on its own. Run:
#   APP_ROOT=/path/to/risk-workbench envsubst '$APP_ROOT' \
#       < deploy/nginx/nginx.conf > /tmp/nginx.conf
#   nginx -c /tmp/nginx.conf
# In the Docker linux-box container, APP_ROOT=/workspace. Native WSL2/RHEL9
# dev and the production server use their own real checkout path instead.
#
# Ports:
#   80  → HTTP (dev only; add TLS termination block for production)
#   8000 → uvicorn (internal only)

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    # ── Buffer tuning for SSE (server-sent events) ─────────────────────────────
    # SSE streams must not be buffered.
    proxy_buffering off;
    proxy_cache off;

    upstream uvicorn {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Static assets — served directly by nginx; never reaches uvicorn.
        location /static/ {
            alias ${APP_ROOT}/app/static/;
            expires 1h;
            add_header Cache-Control "public, immutable";
        }

        # SSE endpoint — disable buffering explicitly.
        location /api/events {
            proxy_pass http://uvicorn;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # All other requests → uvicorn.
        location / {
            proxy_pass http://uvicorn;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
