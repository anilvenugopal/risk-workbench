<option value=""{% if not (options | selectattr('selected') | list) %} selected{% endif %}>Choose a vintage…</option>
{% for option in options %}
<option value="{{ option.vintage }}"{% if option.selected %} selected{% endif %}>
  {%- if option.unresolved -%}
  {{ option.vintage }} (not found in Risk Modeler)
  {%- else -%}
  {{ option.vintage }} — {{ (option.effective_date | string)[:10] }}
  {%- endif -%}
</option>
{% endfor %}
