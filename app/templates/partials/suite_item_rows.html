{% for template in templates %}
<div class="picker-item" data-name="{{ template.name | lower }}">
  <input type="checkbox" name="template_ids" value="{{ template.id }}"
         {% if template.id in selected_ids %}checked{% endif %}>
  <label>{{ template.name }}
    {% if template.profile_family %}
    <span class="badge badge--{{ 'warning' if template.profile_family == 'Accumulation' else ('info' if template.profile_family == 'HD' else 'brand') }} badge--sm">{{ template.profile_family }}</span>
    {% endif %}
    {% if template.unresolved %}<span class="badge badge--negative badge--sm">unresolved</span>{% endif %}
  </label>
</div>
{% else %}
<p class="empty">No analysis templates yet. Create one first.</p>
{% endfor %}
