<div id="crm-tags" class="crm-tags">
  {% for t in crm_tags %}
    {% if is_active %}
    <div class="crm-tag">
      <form class="crm-tag__edit" method="post"
            action="/submissions/{{ submission.id }}/crm-ids/{{ t.id }}"
            hx-post="/submissions/{{ submission.id }}/crm-ids/{{ t.id }}"
            hx-target="#crm-tags" hx-swap="outerHTML">
        <input type="hidden" name="csrf_token" value="{{ generate_csrf_token() }}">
        <input class="crm-tag__input" type="text" name="crm_id" value="{{ t.crm_id }}">
        <button class="crm-tag__btn" type="submit" title="Save">✓</button>
      </form>
      <form class="crm-tag__del" method="post"
            action="/submissions/{{ submission.id }}/crm-ids/{{ t.id }}/delete"
            hx-post="/submissions/{{ submission.id }}/crm-ids/{{ t.id }}/delete"
            hx-target="#crm-tags" hx-swap="outerHTML">
        <input type="hidden" name="csrf_token" value="{{ generate_csrf_token() }}">
        <button class="crm-tag__btn crm-tag__btn--del" type="submit" title="Remove">×</button>
      </form>
    </div>
    {% else %}
    <span class="crm-tag crm-tag--ro">{{ t.crm_id }}</span>
    {% endif %}
  {% else %}
    <span class="tag-empty">No CRM IDs.</span>
  {% endfor %}

  {% if is_active %}
  <form class="crm-add" method="post" action="/submissions/{{ submission.id }}/crm-ids"
        hx-post="/submissions/{{ submission.id }}/crm-ids"
        hx-target="#crm-tags" hx-swap="outerHTML">
    <input type="hidden" name="csrf_token" value="{{ generate_csrf_token() }}">
    <input class="crm-add__input" type="text" name="crm_id" placeholder="Add CRM ID"
           autocomplete="off">
    <button class="btn-sm" type="submit">Add</button>
  </form>
  {% endif %}
</div>
