<div id="crm-tags" class="crm-tags">
  {# Add form comes first so its position is fixed — the chip list grows to the
     right of it instead of pushing the input around. #}
  {% if is_active %}
  <form class="crm-add" method="post" action="/submissions/{{ submission.id }}/crm-ids"
        hx-post="/submissions/{{ submission.id }}/crm-ids"
        hx-target="#crm-tags" hx-swap="outerHTML"
        hx-on::after-request="this.reset()">
    <input type="hidden" name="csrf_token" value="{{ generate_csrf_token() }}">
    <input class="crm-add__input" type="text" name="crm_id" placeholder="Add CRM ID"
           autocomplete="off">
    <button class="btn-sm" type="submit">Add</button>
  </form>
  {% endif %}

  <div class="crm-tags__list">
    {% for t in crm_tags %}
      <span class="crm-tag">
        <span class="crm-tag__text">{{ t.crm_id }}</span>
        {% if is_active %}
        <form method="post"
              action="/submissions/{{ submission.id }}/crm-ids/{{ t.id }}/delete"
              hx-post="/submissions/{{ submission.id }}/crm-ids/{{ t.id }}/delete"
              hx-target="#crm-tags" hx-swap="outerHTML">
          <input type="hidden" name="csrf_token" value="{{ generate_csrf_token() }}">
          <button class="crm-tag__del" type="submit"
                  title="Remove {{ t.crm_id }}" aria-label="Remove {{ t.crm_id }}">×</button>
        </form>
        {% endif %}
      </span>
    {% else %}
      <span class="tag-empty">No CRM IDs.</span>
    {% endfor %}
  </div>
</div>
