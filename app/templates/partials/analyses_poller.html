{# The Analyses section's poll (see analyses_merged_section.html). With
   nothing live it renders no trigger, and the poll stops. #}
{% set live = execution_live|default(false)
     or analyses|selectattr('is_live')|list|length > 0
     or groups|selectattr('sync_running')|list|length > 0 %}
<span id="{{ section_id }}-poller" hidden{% if oob %} hx-swap-oob="true"{% endif %}
  {%- if live %} hx-post="{{ rows_url }}" hx-trigger="every {{ ui_poll_interval_secs }}s" hx-swap="none"
  hx-vals='{{ {"hash": analyses_hash(analyses, groups), "live": poll_ids|join(",")}|tojson }}'{% endif %}></span>
