{# Shared fragments for the template builder and template/metadata tables. #}

{% macro family_badge(family, sm=false) -%}
  {%- if family -%}
  <span class="badge badge--{{ 'warning' if family == 'Accumulation' else ('info' if family == 'HD' else 'brand') }}{{ ' badge--sm' if sm }}">{{ family }}</span>
  {%- endif -%}
{%- endmacro %}

{# The search input + results menu of a selectSearch() typeahead; sits next to
   the hidden <select> inside the field's `.ta` container. #}
{% macro typeahead_controls(required=true) %}
          <input class="wf-field__input" type="text" autocomplete="off" x-cloak{% if required %} required{% endif %}
                 role="combobox" aria-autocomplete="list" :aria-expanded="isOpen"
                 x-ref="input" x-model="query"
                 @focus="open()" @input="onInput()" @keydown="onKey($event)"
                 :placeholder="placeholder">
          <div class="ta__menu" x-ref="menu" x-show="isOpen" x-cloak
               @mousedown.prevent @click="pick($event.target.closest('.ta__opt'))">
            <template x-for="(opt, i) in filteredOptions" :key="i">
              <button type="button" class="ta__opt" :class="{ 'is-active': i === activeIndex }"
                      :data-value="opt.value" x-text="opt.label"></button>
            </template>
            <div class="ta__empty" x-show="!filteredOptions.length">No matches</div>
          </div>
{% endmacro %}
