[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risk-workbench"
version = "0.1.0"
description = "Risk Analysis Workbench — analyst workbench over Moody's Risk Modeler via irp-integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",          # signed session cookies
    "sse-starlette",

    # Database
    "sqlalchemy>=2.0",
    "pyodbc",
    "alembic",
    "pandas>=2.0",
    "pyarrow>=14.0",         # Parquet reading for db.elt.upload_parquet

    # Config
    "pydantic-settings",

    # Workers / queue
    "dramatiq[redis]",
    "redis",
    "irp-integration[databridge]==0.8.0",

    # Auth
    "bcrypt",
    "msal",

    # Treaty .xlsx export (spec 004 R5/FR-024) — server-side workbook from stored detail
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "debugpy",
    "InquirerPy",
    "rich",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "sqlserver: requires a live SQL Server connection (--run-sqlserver flag)",
    "irp: requires a sandbox IRP environment (--run-irp flag)",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=app --cov=db --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "tests/*",
    # Kerberos/Windows-auth shim — only runs on a domain-joined host with krb5 installed.
    # No logic to unit test; no mock surface worth maintaining.
    "db/kerberos.py",
    # Infinite polling loop (while True: sleep(...)). The testable unit is the
    # IRP client calls, not the loop driver. Covered by tests/irp/.
    "app/poller/run.py",
]

[tool.coverage.report]
show_missing = true
