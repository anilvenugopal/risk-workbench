[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "risk-workbench"
version = "0.1.0"
description = "Risk Analysis Workbench — analyst workbench over Moody's Risk Modeler via irp-integration."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
    "itsdangerous",          # signed session cookies
    "sse-starlette",

    # Database
    "sqlalchemy>=2.0",
    "pyodbc",
    "alembic",
    "pandas>=2.0",
    "pyarrow>=14.0",         # Parquet reading for db.elt.upload_parquet

    # Config
    "pydantic-settings",

    # Workers / queue
    "dramatiq[redis]",
    "redis",

    # NOTE: irp-integration is intentionally NOT pinned here. It is declared in three
    # mutually-exclusive dependency groups (irp-pypi / irp-testpypi / irp-local) so its
    # SOURCE can be switched without editing [project.dependencies]. The active source
    # is the irp-* group named in [tool.uv] default-groups below.
    # Switch with:  make irp-pypi | make irp-testpypi | make irp-local

    # Auth
    "bcrypt",
    "msal",

    # Treaty .xlsx export (spec 004 R5/FR-024) — server-side workbook from stored detail
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "ruff",
    "debugpy",
    "InquirerPy",
    "rich",
]

# ── irp-integration source selector — pick exactly ONE (they conflict, see [tool.uv]) ──
# Only the group named in [tool.uv] default-groups is installed. Switch the source with
# `make irp-pypi | make irp-testpypi | make irp-local` (each rewrites default-groups + syncs).
irp-pypi     = ["irp-integration[databridge]>=0.2,<1"]      # production: latest stable from PyPI
irp-testpypi = ["irp-integration[databridge]==0.8.0rc8"]       # dev: pinned pre-release build from TestPyPI
irp-local    = ["irp-integration[databridge]"]              # dev: your editable local checkout (path in [tool.uv.sources])

# ── uv: how irp-integration is sourced ────────────────────────────────────────
# The active source is whichever irp-* dependency group is enabled below. Because it
# lives in default-groups, every `uv sync` / `uv run` uses it — no per-command flags,
# no drift between sync and run. `make irp-*` rewrites the default-groups line + syncs.
[tool.uv]
# IRP source mode. Committed default = PyPI (production). `make irp-*` rewrites the next line only.
default-groups = ["dev", "irp-testpypi"]
# Enforce "exactly one source": enabling two irp-* groups at once is a hard error.
conflicts = [
    [{ group = "irp-pypi" }, { group = "irp-testpypi" }, { group = "irp-local" }],
]

# `explicit = true` keeps TestPyPI from shadowing PyPI for every other package —
# only irp-integration is ever drawn from it (and only when irp-testpypi is enabled).
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
explicit = true

# Each source is bound to its group; the groups that are not enabled are inert.
[tool.uv.sources]
irp-integration = [
    { index = "testpypi", group = "irp-testpypi" },
    # Local editable checkout. Path is relative to this repo root
    # (Desktop/CIC/risk-workbench → Desktop/IRP/irp-integration).
    #
    # COMMENTED OUT ON PURPOSE — do not commit this line uncommented. uv's universal
    # locking resolves EVERY declared source, so an uncommented path here forces the
    # clone to exist on ANY machine that re-resolves the lock (CI, prod, teammates),
    # even when irp-local is not the active source. `make irp-local` uncomments it on
    # demand (and checks the clone exists); `make irp-pypi`/`irp-testpypi` re-comment it.
    # { path = "../../IRP/irp-integration", editable = true, group = "irp-local" },
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "sqlserver: requires a live SQL Server connection (--run-sqlserver flag)",
    "irp: requires a sandbox IRP environment (--run-irp flag)",
]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=app --cov=db --cov-report=term-missing"

[tool.coverage.run]
omit = [
    "tests/*",
    # Kerberos/Windows-auth shim — only runs on a domain-joined host with krb5 installed.
    # No logic to unit test; no mock surface worth maintaining.
    "db/kerberos.py",
    # Infinite polling loop (while True: sleep(...)). The testable unit is the
    # IRP client calls, not the loop driver. Covered by tests/irp/.
    "app/poller/run.py",
]

[tool.coverage.report]
show_missing = true
